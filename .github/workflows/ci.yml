name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: catalog
          MYSQL_USER: catalog
          MYSQL_PASSWORD: catalog
          MYSQL_ROOT_PASSWORD: catalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcatalog"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: catalog
      DB_USER: catalog
      DB_PASSWORD: catalog
      API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, json
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Run migrations
        run: php bin/migrate

      - name: Unit tests
        run: composer test:unit

      - name: Integration tests
        run: composer test:integration

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan past commits, not just the tip.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # Fails the build when an installed package has a known advisory.
      - name: Audit dependencies
        run: composer audit --no-dev --locked

      # CodeQL has no PHP analyzer, so static security scanning is Semgrep's
      # PHP and security-audit rule sets instead. See docs/adr/0005.
      - name: Static security analysis
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/php
            p/security-audit
            p/secrets

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
