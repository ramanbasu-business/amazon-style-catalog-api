services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-catalog}
      MYSQL_USER: ${DB_USER:-catalog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-locally}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-change-me-locally}"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  # Runs the schema to completion and exits. The api and worker wait for it, so a
  # clean "docker compose up" needs no manual migration step.
  migrate:
    build:
      context: .
      target: dev
    command: ["php", "bin/migrate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: dev
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${API_PORT:-8080}:8080"
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
